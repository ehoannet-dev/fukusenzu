<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070a19">
<title>接地極付接地端子付コンセントをゲット！</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a19; color: #eef2ff; overflow: hidden;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #heading { position: fixed; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top)); text-align: center; pointer-events: none; opacity: 0; }
  #heading .eyebrow { font-size: clamp(11px, 2.8vw, 14px); letter-spacing: .3em; color: #9fb6ff; opacity: .9; }
  #heading .title { margin-top: 6px; font-size: clamp(18px, 5.4vw, 36px); font-weight: 800; letter-spacing: .04em; line-height: 1.25;
    color: #fff; text-shadow: 0 0 14px rgba(140,180,255,.9), 0 0 36px rgba(90,130,255,.5); }
  #heading .title em { font-style: normal; white-space: nowrap; color: #ffd98a; text-shadow: 0 0 14px rgba(255,200,120,.9), 0 0 36px rgba(255,170,60,.5); }
  #heading .sub { margin-top: 8px; font-size: clamp(11px, 3vw, 14px); opacity: .75; }
  #heading.show { animation: pop 1.1s cubic-bezier(.2,1.4,.4,1) .25s both; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(-14px) scale(.92); } 60% { opacity: 1; transform: translateY(0) scale(1.03); } 100% { opacity: 1; transform: none; } }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom)); text-align: center; pointer-events: none;
    font-size: clamp(11px, 3vw, 13px); color: #c6d2ff; opacity: 0; transition: opacity 1s 1.6s; }
  html.ready #hint { opacity: .6; }
  #again { position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(60,80,160,.35); color: #dfe7ff; border: 1px solid rgba(160,185,255,.4); border-radius: 999px; padding: 7px 14px;
    font-size: 12px; backdrop-filter: blur(6px); opacity: 0; transition: opacity 1s 2s; cursor: pointer; }
  html.ready #again { opacity: .8; }
  #flip { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(60,80,160,.35); color: #dfe7ff; border: 1px solid rgba(160,185,255,.4); border-radius: 999px; padding: 7px 14px;
    font-size: 12px; backdrop-filter: blur(6px); opacity: 0; transition: opacity 1s 2s; cursor: pointer; }
  html.ready #flip { opacity: .8; }
  /* アースの扉の開け閉め：下の段（裏側を見る・景品の一覧・もう一度）の 1 段上の真ん中。スマホ幅でも横に並べると重なるため */
  #door { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(50px + env(safe-area-inset-bottom)); z-index: 5; white-space: nowrap;
    background: rgba(150,110,30,.35); color: #ffe9b8; border: 1px solid rgba(255,210,130,.5); border-radius: 999px; padding: 7px 16px;
    font-size: 12px; backdrop-filter: blur(6px); opacity: 0; transition: opacity 1s 2s; cursor: pointer; }
  html.ready #door { opacity: .9; }
  #back { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; white-space: nowrap;
    color: #dfe7ff; text-decoration: none; font-size: 12px; line-height: 1; padding: 8px 14px; border-radius: 999px;
    background: rgba(60,80,160,.35); border: 1px solid rgba(160,185,255,.4); backdrop-filter: blur(6px); opacity: .85; }
  html.still #heading, html.still #hint, html.still #again, html.still #flip, html.still #door { animation: none !important; transition: none !important; opacity: 1; }
  html.still #hint { opacity: .6; } html.still #again, html.still #flip { opacity: .8; } html.still #door { opacity: .9; }
  /* 低い画面（横にしたスマホ）は見出しを小さくして、部品の入る帯を広げる */
  @media (max-height: 500px) {
    #heading { top: calc(6px + env(safe-area-inset-top)); }
    #heading .eyebrow { display: none; }
    #heading .title { margin-top: 0; font-size: 22px; }
    #heading .sub { margin-top: 2px; }
  }
  #err { display: none; position: fixed; top: 12px; left: 12px; right: 12px; padding: 10px 14px; background: #5a1420; border-radius: 8px; font-size: 14px; z-index: 9; }
  #debug { display: none; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="heading"><div class="eyebrow">REWARD</div><div class="title">接地極付接地端子付コンセントを<em>ゲット！</em></div><div class="sub">アースの扉の中に接地端子・D 形の穴が接地極・長い差込口が接地側</div></div>
<div id="hint">横になぞると回転 ・ 縦になぞると裏返し ・ ピンチで拡大</div>
<a id="back" href="rewards.html">‹ 景品の一覧</a>
<button id="door" type="button" aria-pressed="false">アースの扉を開ける</button>
<button id="flip" type="button">裏側を見る</button>
<button id="again" type="button">もう一度</button>
<div id="err"></div>
<div id="debug"></div>
<script>window.__GLB_URL__="models/outlet_eet.glb";</script>
