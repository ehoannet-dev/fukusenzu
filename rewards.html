<title>景品の3D部品｜複線図トレーナー</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #070a19; color: #eef2ff;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
  body { background: radial-gradient(ellipse at 50% 30%, rgba(70,95,170,.45), rgba(7,10,25,0) 60%), linear-gradient(#0b1230, #070a19 55%, #020308);
    background-attachment: fixed; min-height: 100vh; box-sizing: border-box;
    padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .top { display: flex; align-items: center; }
  .back { color: #dfe7ff; text-decoration: none; font-size: 13px; padding: 7px 12px; border-radius: 999px;

  header { text-align: center; margin: 18px 0 20px; }
  .eyebrow { font-size: 12px; letter-spacing: .3em; color: #9fb6ff; }
  h1 { margin: 6px 0 0; font-size: clamp(22px, 6vw, 32px); font-weight: 800; letter-spacing: .04em;
    text-shadow: 0 0 14px rgba(140,180,255,.9), 0 0 36px rgba(90,130,255,.5); }
  .lead { margin: 8px 0 0; font-size: 13px; opacity: .75; }
  ul { list-style: none; margin: 0 auto; padding: 0; max-width: 960px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a.card { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; padding: 10px; border-radius: 16px;

  a.card:hover, a.card:focus-visible { border-color: rgba(190,210,255,.8); background: rgba(55,75,150,.45); outline: none; }
  a.card img { width: 96px; height: 96px; border-radius: 12px; flex: none; object-fit: cover; }
  .name { font-size: 16px; font-weight: 700; }
  .desc { margin-top: 4px; font-size: 12px; line-height: 1.5; opacity: .75; }
  .go { margin-top: 6px; font-size: 12px; color: #ffd98a; }
  footer { max-width: 960px; margin: 22px auto 0; font-size: 11px; line-height: 1.6; opacity: .55; text-align: center; }
</style>
</head>
